<div class="auth-container">
  <div class="auth-card fade-in">
    <div class="auth-logo">
      <div class="auth-logo-icon">W</div>
      <span class="auth-logo-text">Welfare Portal</span>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your account</p>

    @if (errorMsg) {
      <div class="alert alert-error" role="alert">{{ errorMsg }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input
          type="email"
          id="login-email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="isInvalid('email')"
          placeholder="Enter your email"
          autocomplete="email">
        @if (isInvalid('email')) {
          <div class="form-error">Valid email is required</div>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input
          type="password"
          id="login-password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="isInvalid('password')"
          placeholder="Enter your password"
          autocomplete="current-password">
        @if (isInvalid('password')) {
          <div class="form-error">Password must be at least 6 characters</div>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="loading" id="login-submit-btn">
        @if (loading) {
          <div class="spinner" style="width:20px;height:20px;border-width:2px;"></div>
          <span>Signing in...</span>
        } @else {
          Sign In
        }
      </button>
    </form>

    <p class="auth-footer-text">
      Don't have an account?
      <a routerLink="/auth/register" id="goto-register-link">Register as Citizen</a>
    </p>
  </div>
</div>
