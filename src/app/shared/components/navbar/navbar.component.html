<nav class="navbar">
  <div class="navbar-brand">
    <div class="brand-icon">W</div>
    <span class="brand-text">Welfare Portal</span>
  </div>

  @if (authService.isAuthenticated()) {
    <div class="navbar-actions">
      <button class="notif-btn" (click)="goToNotifications()" id="nav-notification-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        @if (unreadCount > 0) {
          <span class="notif-badge">{{ unreadCount }}</span>
        }
      </button>

      <div class="user-info">
        <div class="user-avatar">{{ userInitial }}</div>
        <div class="user-meta">
          <span class="user-email">{{ authService.getCurrentUser()?.email }}</span>
          <span class="user-role badge badge-primary">{{ authService.getRoleDisplayName() }}</span>
        </div>
      </div>

      <button class="btn btn-secondary btn-sm" (click)="logout()" id="nav-logout-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  }
</nav>
